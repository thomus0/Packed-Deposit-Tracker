# Throwaway Postgres for the test suite.
#   npm run test:db:up && npm test
services:
  test-db:
    image: postgres:16-alpine
    container_name: pdt-test-pg
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pdt_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d pdt_test']
      interval: 1s
      timeout: 3s
      retries: 30
